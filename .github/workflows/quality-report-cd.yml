name: Quality Report CD

"on":
  workflow_run:
    workflows:
      - Deterministic CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: quality-report-pages
  cancel-in-progress: true

jobs:
  build-site:
    name: Build quality report site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: >-
            ${{
              github.event_name == 'workflow_run' &&
              github.event.workflow_run.head_sha ||
              'main'
            }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve publication context
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == \
            "workflow_run" ]]
          then
            publish_sha="$(
              printf '%s' \
                "${{ github.event.workflow_run.head_sha }}"
            )"

            publish_branch="$(
              printf '%s' \
                "${{ github.event.workflow_run.head_branch }}"
            )"

            publish_mode="workflow_run"

            ci_run_url="$(
              printf '%s' \
                "${{ github.event.workflow_run.html_url }}"
            )"

            upstream_conclusion="$(
              printf '%s' \
                "${{ github.event.workflow_run.conclusion }}"
            )"
          else
            publish_sha="$(
              git rev-parse HEAD
            )"

            publish_branch="main"
            publish_mode="workflow_dispatch"

            ci_run_url="$(
              printf '%s/%s/actions/runs/%s' \
                "${GITHUB_SERVER_URL}" \
                "${GITHUB_REPOSITORY}" \
                "${GITHUB_RUN_ID}"
            )"

            upstream_conclusion="manual"
          fi

          checked_out_sha="$(
            git rev-parse HEAD
          )"

          if [[ "${checked_out_sha}" != \
            "${publish_sha}" ]]
          then
            echo "检出 Commit 与发布 Commit 不一致"
            echo "CHECKED_OUT_SHA=${checked_out_sha}"
            echo "PUBLISH_SHA=${publish_sha}"
            exit 1
          fi

          {
            echo "PUBLISH_SHA=${publish_sha}"
            echo "PUBLISH_BRANCH=${publish_branch}"
            echo "PUBLISH_MODE=${publish_mode}"
            echo "CI_RUN_URL=${ci_run_url}"
            echo "UPSTREAM_CONCLUSION=${upstream_conclusion}"
          } >> "${GITHUB_ENV}"

          echo "PUBLICATION_CONTEXT_CHECK = PASS"

      - name: Run quality site tests
        run: |
          python -m unittest discover \
            -s scripts/reports/tests \
            -p "test_*.py" \
            -v

      - name: Build quality site
        shell: bash
        run: |
          set -euo pipefail

          published_at="$(
            date -u +%Y-%m-%dT%H:%M:%SZ
          )"

          python scripts/reports/build_quality_site.py \
            --repository-root . \
            --manifest \
              quality-site/report-manifest.json \
            --output build/quality-site \
            --commit-sha "${PUBLISH_SHA}" \
            --branch "${PUBLISH_BRANCH}" \
            --publish-mode "${PUBLISH_MODE}" \
            --ci-run-url "${CI_RUN_URL}" \
            --published-at "${published_at}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Validate quality site
        run: |
          python scripts/reports/check_quality_site.py \
            --site build/quality-site

      - name: Verify published commit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path(
                  "build/quality-site/"
                  "build-metadata.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          expected_sha = os.environ["PUBLISH_SHA"]

          assert metadata["commit_sha"] == (
              expected_sha
          )

          index = Path(
              "build/quality-site/index.html"
          ).read_text(
              encoding="utf-8"
          )

          assert expected_sha in index
          assert metadata[
              "overall_status"
          ] in {
              "PASS",
              "WARNING",
              "FAIL",
          }

          print(
              "PUBLISHED_COMMIT_CHECK = PASS"
          )
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/quality-site

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "# 万评质量报告构建"
            echo
            echo "- 发布 Commit：\`${PUBLISH_SHA}\`"
            echo "- 发布分支：\`${PUBLISH_BRANCH}\`"
            echo "- 发布方式：\`${PUBLISH_MODE}\`"
            echo "- 上游状态：\`${UPSTREAM_CONCLUSION}\`"
            echo "- 上游运行：${CI_RUN_URL}"
            echo "- 构建结果：PASS"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-pages:
    name: Deploy GitHub Pages
    needs:
      - build-site

    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy quality report site
        id: deployment
        uses: actions/deploy-pages@v4
